<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG Kaan Çark Çevir</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ggred: '#dc2626',
                        ggdark: '#0f0f13',
                        ggcard: '#18181f',
                        gggold: '#fbbf24',
                        ggblue: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for gamer icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0f;
            color: #f3f4f6;
            background-image: radial-gradient(circle at 50% 10%, rgba(220, 38, 38, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
            min-height: 100vh;
        }
        .gaming-font {
            font-family: 'Cinzel', serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181f;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 4px;
        }
        canvas {
            filter: drop-shadow(0 10px 25px rgba(220, 38, 38, 0.3));
        }
    </style>
</head>
<body class="flex flex-col min-h-screen overflow-x-hidden">

    <header class="bg-ggcard border-b border-red-900/40 px-6 py-4 flex flex-wrap items-center justify-between sticky top-0 z-50 shadow-lg gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-ggred to-gggold flex items-center justify-center shadow-md shadow-red-600/50 border border-gggold">
                <i class="fa-solid fa-crown text-black text-lg"></i>
            </div>
            <div>
                <h1 class="gaming-font text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-gggold via-red-500 to-ggblue">GG KAAN ÇARK</h1>
                <span class="text-xs text-gray-400 font-semibold tracking-widest uppercase">Minecraft & Gaming Wheel</span>
            </div>
        </div>
        <nav class="hidden md:flex items-center space-x-6 text-sm font-semibold text-gray-300">
            <a href="#" class="hover:text-gggold transition flex items-center gap-1.5"><i class="fa-solid fa-gamepad text-ggred"></i> Tüm Çarklar</a>
            <a href="#" class="hover:text-gggold transition flex items-center gap-1.5"><i class="fa-solid fa-fire text-ggred"></i> Rastgele Seç</a>
            <button onclick="openSavedWheelsModal()" class="hover:text-gggold transition flex items-center gap-1.5 text-left bg-transparent border-0 cursor-pointer font-semibold text-sm text-gray-300">
                <i class="fa-solid fa-bookmark text-gggold"></i> Kayıtlı Çarklar
            </button>
            <a href="#" class="hover:text-gggold transition flex items-center gap-1.5"><i class="fa-solid fa-gear text-ggblue"></i> Etkinlik Odası</a>
        </nav>
        <div class="flex items-center space-x-3">
            <button onclick="toggleSound()" id="soundBtn" class="bg-ggdark hover:bg-neutral-800 border border-neutral-700 p-2.5 rounded-xl text-gggold transition flex items-center gap-2 text-xs font-bold">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i> <span class="hidden sm:inline">Sesler Açık</span>
            </button>
            <div class="w-9 h-9 rounded-full bg-neutral-800 border border-red-600/50 flex items-center justify-center text-gggold font-bold overflow-hidden shadow">
                <img src="https://placehold.co/100x100/18181f/fbbf24?text=GK" alt="GG Kaan" class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <section class="lg:col-span-5 bg-ggcard/90 backdrop-blur border border-red-900/30 rounded-2xl p-5 shadow-xl flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
                <h2 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-ggred"></i> Kontrol Paneli
                </h2>
                <span id="itemCountBadge" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-full font-bold">0 Seçenek</span>
            </div>

            <!-- Save Current Wheel Quick Bar -->
            <div class="bg-ggdark border border-neutral-800 p-3 rounded-xl flex items-center gap-2">
                <input type="text" id="saveWheelNameInput" placeholder="Çark Adı (Örn: Çekiliş 1)" class="flex-1 bg-neutral-900 border border-neutral-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-gggold transition">
                <button onclick="saveCurrentWheel()" class="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-3 py-2 rounded-lg text-xs transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-floppy-disk"></i> Çarkı Kaydet
                </button>
            </div>

            <!-- Add new item input -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Yeni Seçenek Ekle</label>
                <div class="flex gap-2">
                    <input type="text" id="newItemInput" placeholder="Örn: Elmas Kılıç Kazan!" class="flex-1 bg-ggdark border border-neutral-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 transition">
                    <button onclick="addItem()" class="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition flex items-center gap-1.5 text-sm">
                        <i class="fa-solid fa-plus"></i> Ekle
                    </button>
                </div>
            </div>

            <!-- Quick Toggles -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-ggdark/60 border border-neutral-800 p-3 rounded-xl flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-300">Ses Efektleri</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="soundToggle" checked class="sr-only peer" onchange="toggleSoundSetting(this)">
                        <div class="w-9 h-5 bg-neutral-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
                    </label>
                </div>
                <div class="bg-ggdark/60 border border-neutral-800 p-3 rounded-xl flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-300">Konfeti Kutlaması</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="confettiToggle" checked class="sr-only peer" onchange="saveSettings()">
                        <div class="w-9 h-5 bg-neutral-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-gggold"></div>
                    </label>
                </div>
            </div>

            <!-- List of options -->
            <div class="space-y-2 flex-1">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Çark Listesi (<span id="listCount">0</span>)</label>
                    <button onclick="resetDefaultItems()" class="text-xs text-ggblue hover:underline font-semibold flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> Varsayılana Dön
                    </button>
                </div>
                <div id="itemListContainer" class="bg-ggdark border border-neutral-800 rounded-xl p-3 max-h-52 overflow-y-auto space-y-2">
                    <!-- Dynamic items inserted via JS -->
                </div>
            </div>

            <div class="pt-2 border-t border-neutral-800 flex gap-2">
                <button onclick="shuffleItems()" class="flex-1 bg-neutral-800 hover:bg-neutral-700 text-gray-200 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 border border-neutral-700">
                    <i class="fa-solid fa-shuffle text-ggblue"></i> Karıştır
                </button>
                <button onclick="clearItems()" class="flex-1 bg-red-950/40 hover:bg-red-900/50 text-red-300 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 border border-red-900/50">
                    <i class="fa-solid fa-trash-can text-red-500"></i> Hepsini Sil
                </button>
            </div>
        </section>

        <section class="lg:col-span-7 bg-ggcard/90 backdrop-blur border border-red-900/30 rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center relative min-h-[500px]">
            
            <div class="text-center mb-4">
                <h3 class="gaming-font text-2xl font-black text-white tracking-wide">Çarkı Çevir, Kararı Şansa Bırak!</h3>
                <p class="text-sm text-gray-400 mt-1">Çarkı çevirmek için ortadaki butona veya aşağıdaki büyük butona tıklayın.</p>
            </div>

            <!-- Wheel Container with Pointer -->
            <div class="relative w-full max-w-[420px] aspect-square flex items-center justify-center my-4">
                <!-- Pointer / Marker -->
                <div class="absolute -top-3 z-30 drop-shadow-[0_4px_6px_rgba(220,38,38,0.6)]">
                    <div class="w-8 h-10 bg-gradient-to-b from-gggold via-red-600 to-red-800 flex items-center justify-center text-white text-xs pt-1 shadow-lg border border-yellow-300 rounded-t-md">
                        <i class="fa-solid fa-caret-down text-lg -mt-3"></i>
                    </div>
                </div>

                <!-- Canvas Wheel -->
                <div class="relative w-full h-full rounded-full border-4 border-gggold/60 shadow-2xl overflow-hidden bg-ggdark">
                    <canvas id="wheelCanvas" class="w-full h-full cursor-pointer" onclick="spinWheel()"></canvas>
                    
                    <!-- Center Spin Button Overlay -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <button onclick="spinWheel()" id="centerSpinBtn" class="pointer-events-auto w-16 h-16 rounded-full bg-gradient-to-tr from-red-700 via-red-600 to-gggold text-white font-black shadow-[0_0_20px_rgba(220,38,38,0.8)] border-4 border-black flex items-center justify-center hover:scale-110 active:scale-95 transition transform duration-200 group">
                            <i class="fa-solid fa-play text-xl ml-0.5 text-black group-hover:text-white transition"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Big Action Spin Button -->
            <div class="w-full max-w-sm mt-4">
                <button onclick="spinWheel()" id="mainSpinBtn" class="w-full bg-gradient-to-r from-red-600 via-red-500 to-gggold hover:from-red-500 hover:to-amber-400 text-black font-black text-lg py-4 rounded-2xl shadow-xl shadow-red-600/40 border border-yellow-400/50 transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-dharmachakra text-2xl animate-spin"></i> ÇARKI ÇEVİR!
                </button>
            </div>

        </section>

    </main>

    <div id="winnerModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-ggcard border-2 border-gggold rounded-3xl p-8 max-w-md w-full mx-4 text-center shadow-[0_0_50px_rgba(251,191,36,0.3)] transform scale-95 transition-transform duration-300 relative overflow-hidden" id="modalContent">
            
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-red-600/20 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-sky-500/20 rounded-full blur-2xl"></div>

            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-red-600 to-gggold mx-auto flex items-center justify-center mb-5 shadow-lg shadow-red-600/50 border-2 border-yellow-300 animate-bounce">
                <i class="fa-solid fa-trophy text-black text-3xl"></i>
            </div>

            <span class="text-xs uppercase font-extrabold tracking-widest text-gggold">KAZANAN SEÇENEK</span>
            <h2 id="winnerText" class="gaming-font text-3xl md:text-4xl font-black text-white mt-2 mb-6 drop-shadow-md">Seçenek 1</h2>

            <div class="flex gap-3 justify-center">
                <button onclick="closeModalAndRemove()" class="bg-neutral-800 hover:bg-neutral-700 text-gray-300 font-bold px-5 py-3 rounded-xl text-sm border border-neutral-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-trash-can text-red-500"></i> Listeden Sil
                </button>
                <button onclick="closeModal()" class="flex-1 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold px-6 py-3 rounded-xl text-sm shadow-lg shadow-red-600/40 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> Harika!
                </button>
            </div>
        </div>
    </div>

    <!-- Saved Wheels Modal -->
    <div id="savedWheelsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-ggcard border-2 border-neutral-700 rounded-3xl p-6 max-w-lg w-full mx-4 shadow-2xl relative">
            <div class="flex items-center justify-between border-b border-neutral-800 pb-3 mb-4">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-bookmark text-gggold"></i> Kayıtlı Çarklarım
                </h3>
                <button onclick="closeSavedWheelsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div id="savedWheelsList" class="space-y-3 max-h-80 overflow-y-auto mb-4">
                <!-- Dynamically populated saved wheels -->
            </div>

            <div class="flex justify-end">
                <button onclick="closeSavedWheelsModal()" class="bg-neutral-800 hover:bg-neutral-700 text-gray-300 font-bold px-5 py-2.5 rounded-xl text-xs border border-neutral-700 transition">
                    Kapat
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const STORAGE_KEY_ITEMS = 'gg_kaan_wheel_items';
        const STORAGE_KEY_SAVED = 'gg_kaan_saved_wheels';
        const STORAGE_KEY_SETTINGS = 'gg_kaan_settings';

        let defaultItems = [
            "Seçenek 1",
            "Seçenek 2",
            "Seçenek 3",
            "Seçenek 4",
            "Seçenek 5",
            "Seçenek 6",
            "Seçenek 7",
            "Seçenek 8"
        ];

        let items = [];
        let currentAngle = 0;
        let isSpinning = false;
        let soundEnabled = true;
        let lastWinner = "";

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        const wheelColors = [
            '#dc2626', // Red
            '#f59e0b', // Amber / Gold
            '#38bdf8', // Light Blue
            '#9333ea', // Purple
            '#10b981', // Emerald
            '#f97316', // Orange
            '#ec4899', // Pink
            '#6366f1'  // Indigo
        ];

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playWinSound() {
            if (!soundEnabled) return;
            initAudio();
            try {
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((note, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note, now + index * 0.12);
                    
                    gain.gain.setValueAtTime(0.2, now + index * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.12 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now + index * 0.12);
                    osc.stop(now + index * 0.12 + 0.3);
                });
            } catch(e) {}
        }

        // LocalStorage Management
        function loadAppData() {
            // Load items
            const savedItems = localStorage.getItem(STORAGE_KEY_ITEMS);
            if (savedItems) {
                try {
                    items = JSON.parse(savedItems);
                } catch(e) {
                    items = [...defaultItems];
                }
            } else {
                items = [...defaultItems];
            }

            // Load settings
            const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
            if (savedSettings) {
                try {
                    const settings = JSON.parse(savedSettings);
                    soundEnabled = settings.sound !== undefined ? settings.sound : true;
                    document.getElementById('soundToggle').checked = soundEnabled;
                    document.getElementById('confettiToggle').checked = settings.confetti !== undefined ? settings.confetti : true;
                    updateSoundButtonUI();
                } catch(e) {}
            }
        }

        function saveItemsToStorage() {
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
        }

        function saveSettings() {
            const sound = document.getElementById('soundToggle').checked;
            const confettiVal = document.getElementById('confettiToggle').checked;
            localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify({ sound, confetti: confettiVal }));
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            drawWheel();
        }

        function drawWheel() {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            const radius = Math.min(width, height) / 2 - 10;
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.clearRect(0, 0, width, height);

            if (items.length === 0) {
                ctx.save();
                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Lütfen seçenek ekleyin', centerX, centerY);
                ctx.restore();
                return;
            }

            const sliceAngle = (2 * Math.PI) / items.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);

            for (let i = 0; i < items.length; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = (i + 1) * sliceAngle;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.fill();
                ctx.strokeStyle = '#0f0f13';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold ' + Math.max(11, Math.min(16, 160 / items.length)) + 'px Inter, sans-serif';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                
                let text = items[i];
                if (text.length > 18) {
                    text = text.substring(0, 16) + '...';
                }

                ctx.fillText(text, radius - 25, 0);
                ctx.restore();
            }

            ctx.restore();
        }

        function spinWheel() {
            if (isSpinning || items.length === 0) return;
            isSpinning = true;

            const spinBtn1 = document.getElementById('mainSpinBtn');
            const spinBtn2 = document.getElementById('centerSpinBtn');
            spinBtn1.disabled = true;
            spinBtn2.disabled = true;
            spinBtn1.classList.add('opacity-50', 'cursor-not-allowed');

            const minSpins = 5;
            const extraSpins = Math.random() * 5;
            const totalRotations = (minSpins + extraSpins) * 2 * Math.PI;
            const targetAngle = currentAngle + totalRotations + (Math.random() * 2 * Math.PI);

            const duration = 4000;
            const startTime = performance.now();
            const startAngle = currentAngle;
            let lastTickSlice = -1;

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + (targetAngle - startAngle) * easeOut;

                const sliceAngle = (2 * Math.PI) / items.length;
                const normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
                const currentSlice = Math.floor((2 * Math.PI - normalizedAngle) % (2 * Math.PI) / sliceAngle);

                if (currentSlice !== lastTickSlice) {
                    playTickSound();
                    lastTickSlice = currentSlice;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    spinBtn1.disabled = false;
                    spinBtn2.disabled = false;
                    spinBtn1.classList.remove('opacity-50', 'cursor-not-allowed');

                    determineWinner();
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function determineWinner() {
            const sliceAngle = (2 * Math.PI) / items.length;
            const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
            const winningIndex = Math.floor(normalizedAngle / sliceAngle) % items.length;

            lastWinner = items[winningIndex];
            playWinSound();

            const confettiEnabled = document.getElementById('confettiToggle').checked;
            if (confettiEnabled) {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#dc2626', '#fbbf24', '#38bdf8', '#ffffff']
                });
            }

            showModal(lastWinner);
        }

        function showModal(winner) {
            const modal = document.getElementById('winnerModal');
            const modalContent = document.getElementById('modalContent');
            const winnerText = document.getElementById('winnerText');

            winnerText.textContent = winner;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('winnerModal');
            const modalContent = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function closeModalAndRemove() {
            items = items.filter(item => item !== lastWinner);
            saveItemsToStorage();
            updateItemListUI();
            drawWheel();
            closeModal();
        }

        function updateItemListUI() {
            const container = document.getElementById('itemListContainer');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-ggcard border border-neutral-800 px-3 py-2 rounded-xl text-sm group hover:border-red-600/50 transition';
                div.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate">
                        <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${wheelColors[index % wheelColors.length]}"></span>
                        <span class="text-gray-200 truncate font-medium">${escapeHtml(item)}</span>
                    </div>
                    <button onclick="removeItem(${index})" class="text-gray-500 hover:text-red-500 transition p-1">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                `;
                container.appendChild(div);
            });

            document.getElementById('itemCountBadge').textContent = items.length + ' Seçenek';
            document.getElementById('listCount').textContent = items.length;
        }

        function addItem() {
            const input = document.getElementById('newItemInput');
            const val = input.value.trim();
            if (val) {
                items.push(val);
                input.value = '';
                saveItemsToStorage();
                updateItemListUI();
                drawWheel();
            }
        }

        document.getElementById('newItemInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        function removeItem(index) {
            if (items.length <= 1) {
                alert('Çarkta en az 1 seçenek kalmalıdır!');
                return;
            }
            items.splice(index, 1);
            saveItemsToStorage();
            updateItemListUI();
            drawWheel();
        }

        function clearItems() {
            if (confirm('Tüm seçenekleri silmek istediğinize emin misiniz?')) {
                items = [];
                saveItemsToStorage();
                updateItemListUI();
                drawWheel();
            }
        }

        function resetDefaultItems() {
            items = [...defaultItems];
            saveItemsToStorage();
            updateItemListUI();
            drawWheel();
        }

        function shuffleItems() {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            saveItemsToStorage();
            updateItemListUI();
            drawWheel();
        }

        // Saved Wheels Management Features
        function saveCurrentWheel() {
            const nameInput = document.getElementById('saveWheelNameInput');
            const wheelName = nameInput.value.trim() || ('Çark ' + new Date().toLocaleDateString());
            
            if (items.length === 0) {
                alert('Boş çark kaydedilemez!');
                return;
            }

            let savedWheels = [];
            const existing = localStorage.getItem(STORAGE_KEY_SAVED);
            if (existing) {
                try { savedWheels = JSON.parse(existing); } catch(e) {}
            }

            // Check if name exists, update or push
            const index = savedWheels.findIndex(w => w.name === wheelName);
            if (index >= 0) {
                savedWheels[index].items = [...items];
            } else {
                savedWheels.push({ name: wheelName, items: [...items] });
            }

            localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(savedWheels));
            nameInput.value = '';
            alert('Çark başarıyla kaydedildi!');
        }

        function openSavedWheelsModal() {
            const modal = document.getElementById('savedWheelsModal');
            const listContainer = document.getElementById('savedWheelsList');
            listContainer.innerHTML = '';

            let savedWheels = [];
            const existing = localStorage.getItem(STORAGE_KEY_SAVED);
            if (existing) {
                try { savedWheels = JSON.parse(existing); } catch(e) {}
            }

            if (savedWheels.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">Henüz kayıtlı bir çark bulunmuyor.</p>';
            } else {
                savedWheels.forEach((wheel, idx) => {
                    const div = document.createElement('div');
                    div.className = 'bg-ggdark border border-neutral-800 p-3 rounded-xl flex items-center justify-between gap-3';
                    div.innerHTML = `
                        <div class="truncate">
                            <h4 class="font-bold text-sm text-white truncate">${escapeHtml(wheel.name)}</h4>
                            <span class="text-xs text-gray-400">${wheel.items.length} seçenek</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="loadSavedWheel(${idx})" class="bg-ggblue/20 hover:bg-ggblue/30 text-ggblue font-bold px-3 py-1.5 rounded-lg text-xs transition border border-ggblue/30">
                                Yükle
                            </button>
                            <button onclick="deleteSavedWheel(${idx})" class="bg-red-950/40 hover:bg-red-900/50 text-red-400 font-bold px-3 py-1.5 rounded-lg text-xs transition border border-red-900/50">
                                Sil
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(div);
                });
            }

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeSavedWheelsModal() {
            const modal = document.getElementById('savedWheelsModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function loadSavedWheel(index) {
            let savedWheels = [];
            const existing = localStorage.getItem(STORAGE_KEY_SAVED);
            if (existing) {
                try {
                    savedWheels = JSON.parse(existing);
                    if (savedWheels[index]) {
                        items = [...savedWheels[index].items];
                        saveItemsToStorage();
                        updateItemListUI();
                        drawWheel();
                        closeSavedWheelsModal();
                    }
                } catch(e) {}
            }
        }

        function deleteSavedWheel(index) {
            let savedWheels = [];
            const existing = localStorage.getItem(STORAGE_KEY_SAVED);
            if (existing) {
                try {
                    savedWheels = JSON.parse(existing);
                    savedWheels.splice(index, 1);
                    localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(savedWheels));
                    openSavedWheelsModal();
                } catch(e) {}
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').checked = soundEnabled;
            updateSoundButtonUI();
            saveSettings();
        }

        function toggleSoundSetting(checkbox) {
            soundEnabled = checkbox.checked;
            updateSoundButtonUI();
            saveSettings();
        }

        function updateSoundButtonUI() {
            const btn = document.getElementById('soundBtn');
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                btn.querySelector('span').textContent = 'Sesler Açık';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                btn.querySelector('span').textContent = 'Sesler Kapalı';
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = function() {
            loadAppData();
            updateItemListUI();
            resizeCanvas();
        };

        window.onresize = function() {
            resizeCanvas();
        };
    </script>
</body>
</html>
